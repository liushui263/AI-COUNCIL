<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 议事厅</title>
<style>
:root {
  --bg: #faf9f7; --side: #f3f1ed; --panel: #ffffff; --text: #1f1e1c; --muted: #6f6b66; --border: #e5e2dc;
  --accent: #c2410c; --accent-soft: #fbe9df; --accent-text: #ffffff; --ok: #15803d; --fail: #dc2626; --run: #2563eb;
  --wait: #a8a29e; --warn-bg: #fef3c7; --warn-text: #854d0e; --err-bg: #fee2e2; --err-text: #991b1b;
  --code-bg: #f1efeb; --user-bg: #efece6; --shadow: 0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1f1e1c; --side: #181715; --panel: #262523; --text: #ecebe8; --muted: #a29e97; --border: #3a3834;
    --accent: #f08a5d; --accent-soft: #3a2a22; --accent-text: #1b1310; --ok: #4ade80; --fail: #f87171; --run: #60a5fa;
    --wait: #78716c; --warn-bg: #3b3210; --warn-text: #fde68a; --err-bg: #3b1515; --err-text: #fecaca;
    --code-bg: #2f2d2a; --user-bg: #33312d; --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }

/* ---------- 三栏布局 ---------- */
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr) 460px; height: 100vh; height: 100dvh; }
.app.no-right { grid-template-columns: 260px minmax(0, 1fr) 0; }
.app.no-right .right { display: none; }
.left { background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.mid { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.right { background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
@media (max-width: 1280px) { .app { grid-template-columns: 230px minmax(0, 1fr) 400px; } .app.no-right { grid-template-columns: 230px minmax(0, 1fr) 0; } }
@media (max-width: 880px) {
  .app, .app.no-right { grid-template-columns: minmax(0, 1fr); }
  .left, .right { position: fixed; top: 0; bottom: 0; z-index: 30; width: min(86vw, 360px); transition: transform .2s; box-shadow: 0 0 24px rgba(0,0,0,.2); }
  .left { left: 0; transform: translateX(-105%); }
  .right { right: 0; transform: translateX(105%); }
  .app.no-right .right { display: flex; }
  body.show-left .left, body.show-right .right { transform: none; }
  body.show-left .scrim, body.show-right .scrim { display: block; }
}
.scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 25; }
.only-narrow { display: none !important; }
@media (max-width: 880px) { .only-narrow { display: inline-flex !important; } .only-wide { display: none !important; } }

/* ---------- 左栏 ---------- */
.left-top { padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 10px; }
.brand { font-weight: 700; font-size: 17px; padding: 0 6px; }
.new-btn { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--panel); cursor: pointer; font-weight: 600; }
.new-btn:hover { border-color: var(--accent); }
.hist-title { font-size: 12px; color: var(--muted); padding: 8px 18px 4px; }
.hist { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
.hist-item { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.hist-item:hover { background: var(--code-bg); }
.hist-item.active { background: var(--accent-soft); }
.hist-item .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.left-foot { border-top: 1px solid var(--border); padding: 8px; }
.nav-btn { width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.nav-btn:hover, .nav-btn.active { background: var(--code-bg); }

/* ---------- 中栏 ---------- */
.mid-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); min-height: 52px; }
.mid-head .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mid-body { flex: 1; overflow-y: auto; padding: 20px 16px 28px; }
.col { max-width: 780px; margin: 0 auto; }
.composer-wrap { padding: 0 16px 14px; }
.composer { max-width: 780px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
  padding: 10px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
.composer textarea { width: 100%; border: 0; background: transparent; resize: none; outline: none; padding: 4px 2px; min-height: 48px; max-height: 40vh; }
.composer-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.composer-bar .spacer { flex: 1; }
.hero { text-align: center; padding: 8vh 0 18px; }
.hero h1 { font-size: 26px; font-weight: 600; margin: 0 0 8px; font-family: Georgia, "Songti SC", "SimSun", serif; }

/* 对话流 */
.bubble-user { margin: 14px 0 14px auto; max-width: 85%; width: fit-content; background: var(--user-bg); padding: 10px 14px;
  border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble-user .lbl { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.round-sep { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 22px 0 10px; }
.round-sep::before, .round-sep::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
.msg { display: flex; gap: 10px; margin: 12px 0; }
.avatar { width: 30px; height: 30px; border-radius: 8px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; }
.msg-main { flex: 1; min-width: 0; }
.msg-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.msg-head .who { font-weight: 600; }
.msg-head .meta { color: var(--muted); font-size: 12px; }
.msg-body { overflow-wrap: anywhere; }
.msg-body.plain { white-space: pre-wrap; }
.msg-foot { color: var(--muted); font-size: 12px; }
.report-chip { display: flex; gap: 10px; align-items: center; margin: 16px 0; padding: 12px 14px; border: 1px solid var(--accent);
  background: var(--accent-soft); border-radius: 12px; cursor: pointer; }
.report-chip .t { font-weight: 600; flex: 1; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--wait); flex: none; display: inline-block; }
.dot.running { background: var(--run); animation: pulse 1s infinite; }
.dot.ok, .dot.done { background: var(--ok); } .dot.failed { background: var(--fail); }
.dot.partial, .dot.cancelled, .dot.interrupted { background: #d97706; }
@keyframes pulse { 50% { opacity: .3; } }

/* ---------- 右栏 ---------- */
.tabs { display: flex; gap: 4px; padding: 10px 12px 0; border-bottom: 1px solid var(--border); }
.tabs button { background: none; border: 0; padding: 8px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tabs .x { margin-left: auto; }
.right-body { flex: 1; overflow-y: auto; padding: 14px; }
.sec { margin-bottom: 18px; }
.sec h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
/* 参会者：一人一行（勾选 · 名称 · 模型 · 角色 · 加减） */
.seats { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.seat { display: grid; grid-template-columns: 20px 92px minmax(0, 1.5fr) minmax(0, 1fr) auto; gap: 6px; align-items: center;
  padding: 5px 8px; border-top: 1px solid var(--border); background: var(--panel); }
.seat.people { grid-template-columns: 22px 88px minmax(0, 1.5fr) minmax(0, 1fr) 26px; }
.seat.added { background: var(--accent-soft); }
.seat:first-child { border-top: 0; }
.seat.off .sel { opacity: .5; }
.seat .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat .sel { padding: 4px 6px; font-size: 13px; }
.seat .acts { display: flex; gap: 2px; }
.seat .acts button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 2px 5px; border-radius: 6px; }
.seat .acts button:hover { background: var(--code-bg); color: var(--text); }
.seat .nokey { grid-column: 3 / 5; font-size: 13px; }

/* ---------- 通用控件 ---------- */
input[type=text], input[type=password], input[type=number], textarea.box, select {
  width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); min-width: 0; }
input:focus, textarea.box:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.btn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; padding: 6px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--panel); cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.danger { color: var(--fail); }
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn.icon { padding: 4px 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 auto; min-width: 0; }
.hint { color: var(--muted); font-size: 13px; }
.badge { display: inline-block; font-size: 12px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.badge.ok { color: var(--ok); border-color: var(--ok); } .badge.fail { color: var(--fail); border-color: var(--fail); }
.badge.free { color: var(--accent); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chips:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 4px 2px 8px; border-radius: 8px;
  background: var(--code-bg); border: 1px solid var(--border); max-width: 100%; }
.chip .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.chip button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; }
.composer.drop { outline: 2px dashed var(--accent); }
.warn { background: var(--warn-bg); color: var(--warn-text); padding: 7px 10px; border-radius: 8px; font-size: 13px; }
.err { background: var(--err-bg); color: var(--err-text); padding: 7px 10px; border-radius: 8px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.num { width: 64px !important; text-align: center; }
label.lbl { display: block; font-size: 13px; color: var(--muted); margin-bottom: 3px; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.md h1, .md h2, .md h3, .md h4 { margin: 14px 0 6px; line-height: 1.35; }
.md h1 { font-size: 18px; } .md h2 { font-size: 16px; } .md h3, .md h4 { font-size: 15px; }
.md p { margin: 6px 0; } .md ul, .md ol { margin: 6px 0; padding-left: 22px; }
.md code { background: var(--code-bg); padding: 1px 4px; border-radius: 4px; font-size: 90%; }
.md pre { background: var(--code-bg); padding: 10px; border-radius: 6px; overflow: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--border); color: var(--muted); }
.md table { border-collapse: collapse; margin: 8px 0; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
.md hr { border: 0; border-top: 1px solid var(--border); }
.srow { padding: 14px 0; border-top: 1px solid var(--border); }
.srow:first-child { border-top: 0; }
.empty { color: var(--muted); text-align: center; padding: 24px 8px; font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 8px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; max-width: 90vw; }
.toast.show { opacity: .95; }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="left" id="left">
    <div class="left-top">
      <div class="brand">AI 议事厅</div>
      <button class="new-btn" id="btn-new">＋ 新辩论</button>
    </div>
    <div class="hist-title">历史</div>
    <div class="hist" id="hist"></div>
    <div class="left-foot"><button class="nav-btn" id="btn-settings">⚙ 设置（Key 与模型）</button></div>
  </aside>

  <main class="mid">
    <div class="mid-head">
      <button class="btn icon only-narrow" id="btn-show-left" aria-label="打开历史">☰</button>
      <div class="title" id="mid-title">新辩论</div>
      <span class="hint" id="mid-status"></span>
      <button class="btn icon only-narrow" id="btn-show-right" aria-label="打开侧栏">⚙ 参会者</button>
      <button class="btn small only-wide" id="btn-toggle-right" title="隐藏/显示右侧栏">隐藏侧栏 ⇥</button>
    </div>
    <div class="mid-body" id="mid-body"></div>
    <div class="composer-wrap" id="composer-wrap"></div>
  </main>

  <aside class="right" id="right">
    <div class="tabs" id="right-tabs"></div>
    <div class="right-body" id="right-body"></div>
  </aside>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
// ============================================================ 工具
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else if (k in el && k !== "list") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(kid));
  return el;
}
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
// 重试倒计时：带 data-at 的元素每 0.5 秒刷新“N 秒后重试”
function noteSpan(cls, note, at) {
  const el = h("span", { class: cls });
  if (at) { el.classList.add("cd"); el.dataset.note = note; el.dataset.at = at; el.textContent = cdText(note, +at); }
  else el.textContent = note;
  return el;
}
function cdText(note, at) {
  const left = Math.ceil((at - Date.now()) / 1000);
  return note.replace(/\d+ 秒后重试/, left > 0 ? `${left} 秒后重试` : "正在重试");
}
setInterval(() => document.querySelectorAll(".cd").forEach((el) => { el.textContent = cdText(el.dataset.note, +el.dataset.at); }), 500);

// 上传文档：txt / md / pdf / docx，后端提取文字；list 是 [{name, text, chars, truncated}]
const ATTACH_ACCEPT = ".txt,.md,.markdown,.csv,.json,.log,.pdf,.docx";
function readB64(file) {
  return new Promise((ok, bad) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(",")[1] || "");
    r.onerror = () => bad(new Error(`读取 ${file.name} 失败`));
    r.readAsDataURL(file);
  });
}
async function addFiles(files, list, redraw) {
  for (const f of files) {
    if (list.length >= 5) { toast("最多上传 5 个文件"); break; }
    if (f.size > 10 * 1024 * 1024) { toast(`${f.name} 超过 10MB`); continue; }
    const item = { name: f.name, loading: true };
    list.push(item); redraw();
    try {
      Object.assign(item, await api("POST", "/api/extract", { name: f.name, data: await readB64(f) }), { loading: false });
      if (item.truncated) toast(`${f.name} 共 ${item.chars} 字，只发送前 ${item.text.length} 字`);
    } catch (e) { list.splice(list.indexOf(item), 1); toast(e.message); }
    redraw();
  }
}
function attachChips(list, redraw) {
  return h("div", { class: "chips" }, list.map((a) => h("span", { class: "chip", title: a.name },
    h("span", { class: "n" }, `📄 ${a.name}`),
    h("span", { class: "hint" }, a.loading ? "读取中…" : `${a.truncated ? "前 " + a.text.length : a.chars} 字`),
    redraw ? h("button", { title: "移除", onclick: () => { list.splice(list.indexOf(a), 1); redraw(); } }, "✕") : null)));
}
function attachButton(list, redraw) {
  const input = h("input", { type: "file", multiple: true, accept: ATTACH_ACCEPT, style: "display:none",
    onchange: (e) => { addFiles([...e.target.files], list, redraw); e.target.value = ""; } });
  return [input, h("button", { class: "btn small", title: "支持 txt、md、pdf、docx，文字会发给每个参会 AI", onclick: () => input.click() }, "📎 上传文档")];
}
function enableDrop(el, list, redraw) {
  el.addEventListener("dragover", (e) => { e.preventDefault(); el.classList.add("drop"); });
  el.addEventListener("dragleave", () => el.classList.remove("drop"));
  el.addEventListener("drop", (e) => { e.preventDefault(); el.classList.remove("drop"); addFiles([...e.dataTransfer.files], list, redraw); });
}
const attPayload = (list) => list.filter((a) => !a.loading).map(({ name, text }) => ({ name, text }));
const attNames = (list) => (list || []).length ? h("div", { class: "chips" }, list.map((a) => h("span", { class: "chip", title: a.name }, h("span", { class: "n" }, `📄 ${a.name}`)))) : null;

// 导出：Markdown、Word（.docx）、PDF（打开打印页，在浏览器里“另存为 PDF”）
function exportLinks(id) {
  const base = `/api/debates/${id}/export`;
  return [h("a", { class: "btn small", href: `${base}.md`, download: "", title: "Markdown 文本" }, "导出 .md"),
    h("a", { class: "btn small", href: `${base}.docx`, download: "", title: "Word 文档" }, "Word"),
    h("a", { class: "btn small", href: `${base}.html`, target: "_blank", rel: "noopener", title: "打开打印页，选择“另存为 PDF”" }, "PDF")];
}

async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const res = await fetch(path, opt);
  let data = null;
  try { data = await res.json(); } catch (_) { /* 非 JSON */ }
  if (!res.ok) throw new Error((data && data.error) || `请求失败（HTTP ${res.status}）`);
  return data;
}
function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return iso;
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
const STATUS_TEXT = { running: "进行中", done: "已完成", partial: "部分完成", cancelled: "已取消", interrupted: "已中断" };
const MSG_STATUS = { pending: "等待中", running: "生成中", ok: "已完成", failed: "失败" };
const DEFAULT_ROLE = "中立专家";

// ============================================================ 迷你 Markdown 渲染（先转义，再加格式，安全）
function mdInline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/__(.+?)__/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");
  s = s.replace(/~~(.+?)~~/g, "<del>$1</del>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[+i])}</code>`);
}
function md(src) {
  const lines = String(src || "").replace(/\r\n?/g, "\n").split("\n");
  let out = "", i = 0;
  const isTableSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => mdInline(c.trim()));
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; out += `<pre><code>${esc(buf.join("\n"))}</code></pre>`; continue;
    }
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { const n = Math.min(m[1].length, 4); out += `<h${n}>${mdInline(m[2])}</h${n}>`; i++; continue; }
    if (/^\s*([-*_])\s*(\1\s*){2,}$/.test(line)) { out += "<hr>"; i++; continue; }
    if (line.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const head = cells(line); i += 2; let body = "";
      while (i < lines.length && lines[i].includes("|") && lines[i].trim()) { body += "<tr>" + cells(lines[i]).map((c) => `<td>${c}</td>`).join("") + "</tr>"; i++; }
      out += `<table><thead><tr>${head.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`; continue;
    }
    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out += `<blockquote>${md(buf.join("\n"))}</blockquote>`; continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
      const ordered = /^\s*\d+[.)]\s+/.test(line); const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
        let item = lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, "");
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) item += " " + lines[i++].trim();
        items.push(`<li>${mdInline(item)}</li>`);
      }
      out += ordered ? `<ol>${items.join("")}</ol>` : `<ul>${items.join("")}</ul>`; continue;
    }
    if (!line.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\s*```|\s*>|\s*([-*+]|\d+[.)])\s+)/.test(lines[i])) buf.push(mdInline(lines[i++]));
    out += `<p>${buf.join("<br>")}</p>`;
  }
  return out;
}

function validateSetup() {

  else if (!(st.maxTokens >= 200 && st.maxTokens <= 16384)) reason = "最大输出长度需在 200~16384";

function findMsg(r, pid) {
  const rnd = S.cur.d.rounds.find((x) => x.index === r);
  return rnd ? rnd.messages.find((m) => m.participant === pid) : null;
}
function redrawMsg(r, m) {
  const el = document.getElementById(`m-${r}-${m.participant}`);
  const box = $("#mid-body"), stick = nearBottom(box);
  if (el) el.replaceWith(msgEl(m, r)); else renderMidBody();
  if (stick) box.scrollTop = box.scrollHeight;
}
function connectEvents(id) {
  const es = new EventSource(`/api/debates/${id}/events`);
  S.cur.es = es;
  const on = (name, fn) => es.addEventListener(name, (ev) => {
    if (!S.cur || S.cur.id !== id || S.mode !== "debate") return;
    let data = {}; try { data = JSON.parse(ev.data); } catch (_) { /* 忽略 */ }
    fn(data, S.cur.d);
  });
  on("round_started", (x, d) => {
    if (!d.rounds.find((r) => r.index === x.round)) {
      d.rounds.push({ index: x.round, messages: d.config.participants.map((p) => ({ participant: p.id, provider: p.provider, model: p.model, role: p.role, text: "", status: "pending" })) });
      renderMidBody();
    }
  });
  on("participant_started", (x) => { const m = findMsg(x.round, x.participant); if (m) { Object.assign(m, { status: "running", text: "", note: null, usage: null }); redrawMsg(x.round, m); } });
  on("participant_retry", (x) => { const m = findMsg(x.round, x.participant); if (m) { Object.assign(m, { status: "running", text: "", note: x.note, retryAt: x.retry_at }); redrawMsg(x.round, m); } });
  on("token", (x) => {
    const m = findMsg(x.round, x.participant); if (!m) return;
    const first = !m.text; m.text = (m.text || "") + x.delta;
    const el = document.getElementById(`mb-${x.round}-${x.participant}`);
    if (!el || first) { redrawMsg(x.round, m); return; }
    const box = $("#mid-body"), stick = nearBottom(box);
    el.textContent = m.text;
    if (stick) box.scrollTop = box.scrollHeight;
  });
  on("message_done", (x) => { const m = findMsg(x.round, x.participant); if (m) { Object.assign(m, { status: "ok", text: x.text, usage: x.usage, note: null }); redrawMsg(x.round, m); } });
  on("message_failed", (x) => { const m = findMsg(x.round, x.participant); if (m) { Object.assign(m, { status: "failed", error: x.error, note: null }); redrawMsg(x.round, m); } });
  on("synthesis_started", (x) => { S.cur.synthLive = { by: x.by, text: "", status: "running" }; S.cur.reportIdx = null; S.tab = "report"; renderMidBody(); renderRight(); });
  on("synthesis_retry", (x) => { const l = S.cur.synthLive; if (!l) return; l.text = ""; l.note = x.note; l.retryAt = x.retry_at; if (x.by) l.by = x.by; renderMidBody(); renderRight(); });
  on("synthesis_token", (x) => {
    const l = S.cur.synthLive; if (!l) return; l.text += x.delta;
    const el = $("#live-report"); if (el) el.textContent = l.text;
  });
  on("synthesis_failed", (x) => { const l = S.cur.synthLive; if (l) { l.status = "failed"; l.error = x.error; renderRight(); } });
  const finish = (msg) => { es.close(); if (S.cur) { S.cur.es = null; S.cur.reportIdx = null; } toast(msg); refreshCurrent(false); loadHistory(); };
  on("debate_done", (x) => finish(x.archived ? "这场辩论已结束" : `辩论${STATUS_TEXT[x.status] || "结束"}`));
  on("debate_cancelled", () => finish("辩论已取消，已完成的轮次已保留"));
  es.onerror = () => { /* 断线时 EventSource 自动重连，服务端按 Last-Event-ID 续传 */ };
}

          try {
            const r = await api("PUT", `/api/providers/${p.id}/key`, { key: k }); keyInput.value = "";
            toast(r.refresh_error ? `${p.name} key 已保存，但获取模型列表失败：${r.refresh_error}` : `${p.name} key 已保存，获取到 ${r.models} 个模型，默认使用 ${r.default_model}`);
            await loadProviders(); seatsSyncDefaults(); renderSettings();
          } catch (e) { toast(e.message); }
        } }, "保存"),
        p.key_configured ? h("button", { class: "btn small danger", onclick: async () => {
          if (!confirm(`删除 ${p.name} 的 key？`)) return;
          try { await api("DELETE", `/api/providers/${p.id}/key`); toast("已删除"); await loadProviders(); renderSettings(); } catch (e) { toast(e.message); }
        } }, "删除") : null),
      h("div", { class: "row", style: "margin-top:8px" }, refreshBtn, modelsInfo)));
  });
  box.append(col);
}

// ============================================================ 启动
(async function boot() {
  await loadProviders();
  await loadHistory();
  const running = HISTORY.find((x) => x.status === "running");
  if (running) { await openDebate(running.id); return; }
  showNew();
})();
</script>
</body>
</html>
